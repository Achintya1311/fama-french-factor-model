[project]
name = "factors"
version = "0.1.0"
description = "Fama-French factor model: CAPM/FF3/FF5+WML regressions on Indian (IIMA) factors."
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pandas",
    "scipy",
    "statsmodels",
    "matplotlib",
    "yfinance",
]

[project.optional-dependencies]
dev = ["pytest"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["factors*"]
